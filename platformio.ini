[env:esp32s3_waveshare]
; Use pioarduino platform (or official espressif32 with Arduino 3.x support)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
framework = arduino
board = esp32-s3-devkitc-1

; CPU & Flash Configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Memory & Partition Settings
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_large_partitions.csv

; External Library Dependencies
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lvgl/lvgl @ ^9.3.0
    lewisxhe/SensorLib @ ^0.2.0

; Preprocessor & Include Flags
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I .
    -I include
    -I src
    -I src/esp_codec_dev/include
    -I src/esp_codec_dev/interface
    -I src/esp_codec_dev/device/include

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder